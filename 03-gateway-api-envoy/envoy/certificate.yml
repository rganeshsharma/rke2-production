apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dai-wildcard-tls
  namespace: gateway-system
spec:
  secretName: dai-wildcard-tls

  dnsNames:
    - "*.dev.mindsparks.io"

  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: ECDSA
    size: 256