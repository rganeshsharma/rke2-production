apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-shared-gateway
  namespace: gateway-system
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer

spec:
  gatewayClassName: envoy

  addresses:
    - type: IPAddress
      value: 10.25.83.200

  listeners:

    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.dev.mindsparks.io"

      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.dev.mindsparks.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dai-wildcard-tls

      allowedRoutes:
        namespaces:
          from: All