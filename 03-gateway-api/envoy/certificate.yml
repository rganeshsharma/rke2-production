apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-tls-cert
  namespace: gateway-system
spec:
  secretName: wildcard-tls-cert

  dnsNames:
    - "*.dev.yourdomain.com"

  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: ECDSA
    size: 256